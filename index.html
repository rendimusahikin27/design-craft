<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DesignCraft — UI/UX Design Tool</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/toolbar.css" />
    <link rel="stylesheet" href="css/panel.css" />
    <link rel="stylesheet" href="css/canvas.css" />
    <link rel="stylesheet" href="css/widgets.css" />
  </head>
  <body>
    <!-- TOP TOOLBAR -->
    <header class="top-toolbar" id="topToolbar">
      <div class="toolbar-left">
        <div class="logo">
          <i class="fas fa-pen-ruler"></i><span>DesignCraft</span>
        </div>
        <div class="tb-sep"></div>
        <button class="tb-btn" id="btnUndo" title="Undo (Ctrl+Z)">
          <i class="fas fa-undo"></i>
        </button>
        <button class="tb-btn" id="btnRedo" title="Redo (Ctrl+Y)">
          <i class="fas fa-redo"></i>
        </button>
        <div class="tb-sep"></div>
        <!-- Tools -->
        <div class="tool-group">
          <button
            class="tb-btn active"
            id="btnToolSelect"
            data-tool="select"
            title="Select (V)"
          >
            <i class="fas fa-mouse-pointer"></i>
          </button>
          <button
            class="tb-btn"
            id="btnToolHand"
            data-tool="hand"
            title="Hand Tool (H / Space)"
          >
            <i class="fas fa-hand-paper"></i>
          </button>
        </div>
      </div>
      <div class="tb-sep"></div>
      <div class="toolbar-center">
        <div class="vp-tabs">
          <button class="vp-tab active" data-vp="desktop">
            <i class="fas fa-desktop"></i><span>Desktop</span>
          </button>
          <button class="vp-tab" data-vp="tablet">
            <i class="fas fa-tablet-alt"></i><span>Tablet</span>
          </button>
          <button class="vp-tab" data-vp="mobile">
            <i class="fas fa-mobile-alt"></i><span>Mobile</span>
          </button>
        </div>
      </div>
      <div class="toolbar-right">
        <button class="tb-btn" id="btnToggleLeft" title="Widgets Panel">
          <i class="fas fa-th-large"></i>
        </button>
        <button class="tb-btn" id="btnToggleRight" title="Properties Panel">
          <i class="fas fa-sliders-h"></i>
        </button>
        <div class="tb-sep"></div>
        <!-- Zoom Control -->
        <div class="zoom-ctrl">
          <button
            class="tb-btn zoom-btn"
            id="btnZoomOut"
            title="Zoom Out (Ctrl+-)"
          >
            <i class="fas fa-minus"></i>
          </button>
          <button
            class="zoom-val-btn"
            id="btnZoomVal"
            title="Double-click to fit, Click to reset"
          >
            <span id="zoomValue">100%</span>
          </button>
          <button
            class="tb-btn zoom-btn"
            id="btnZoomIn"
            title="Zoom In (Ctrl++)"
          >
            <i class="fas fa-plus"></i>
          </button>
          <button
            class="tb-btn zoom-btn"
            id="btnZoomFit"
            title="Fit to Screen (Ctrl+0)"
          >
            <i class="fas fa-expand"></i>
          </button>
        </div>
        <div class="tb-sep"></div>
        <button class="tb-btn" id="btnPreview">
          <i class="fas fa-eye"></i><span>Preview</span>
        </button>
        <button class="tb-btn" id="btnExport">
          <i class="fas fa-code"></i><span>Export</span>
        </button>
        <button class="tb-btn primary" id="btnSave">
          <i class="fas fa-save"></i><span>Save</span>
        </button>
      </div>
    </header>

    <!-- INFINITE CANVAS AREA -->
    <main class="canvas-area" id="canvasArea">
      <!-- Pan/Zoom info overlay -->
      <div class="canvas-info" id="canvasInfo">
        <span id="canvasCoords">0, 0</span>
      </div>

      <!-- The infinite workspace -->
      <div class="canvas-world" id="canvasWorld">
        <!-- The actual design frame -->
        <div class="canvas-frame" id="canvasFrame">
          <div class="frame-label" id="frameLabel">Desktop — 1200 × 700</div>
          <div class="canvas" id="canvas" data-vp="desktop">
            <div class="canvas-hint" id="canvasHint">
              <div class="hint-icon"><i class="fas fa-plus-circle"></i></div>
              <p>Drag & Drop widgets here</p>
              <span>or double-click a widget from the panel</span>
              <div class="hint-shortcuts">
                <kbd>Ctrl</kbd>+<kbd>Scroll</kbd> Zoom &nbsp;
                <kbd>Space</kbd>+<kbd>Drag</kbd> Pan &nbsp;
                <kbd>Middle Click</kbd> Pan
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Zoom slider (bottom-right) -->
      <div class="canvas-zoom-bar" id="canvasZoomBar">
        <button class="czb-btn" id="czZoomOut">
          <i class="fas fa-minus"></i>
        </button>
        <input
          type="range"
          id="czSlider"
          min="10"
          max="300"
          value="100"
          step="1"
        />
        <button class="czb-btn" id="czZoomIn">
          <i class="fas fa-plus"></i>
        </button>
        <span class="czb-val" id="czVal">100%</span>
      </div>
    </main>

    <!-- LEFT PANEL -->
    <aside class="fp fp-left open" id="panelLeft">
      <div class="fp-head" id="fpHeadLeft">
        <div class="fp-tabs">
          <button class="fp-tab active" data-lp="widgets">
            <i class="fas fa-th-large"></i>
            <span class="fp-tab-label">Widgets</span>
          </button>
          <button class="fp-tab" data-lp="layers">
            <i class="fas fa-layer-group"></i>
            <span class="fp-tab-label">Layers</span>
          </button>
        </div>
        <div class="fp-head-actions">
          <button
            class="fp-mini-toggle"
            id="btnMiniToggle"
            title="Toggle Mini Sidebar"
          >
            <i class="fas fa-compress-alt" id="miniToggleIcon"></i>
          </button>
          <button class="fp-x" id="closeLeft">
            <i class="fas fa-times"></i>
          </button>
        </div>
      </div>
      <div class="fp-body" id="panelWidgets">
        <!-- Search (hidden in mini mode via CSS) -->
        <div class="search-box mini-hide">
          <i class="fas fa-search"></i>
          <input
            type="text"
            id="widgetSearch"
            placeholder="Search widgets..."
          />
        </div>
        <div class="wg-container" id="wgContainer"></div>
      </div>
      <div class="fp-body hidden" id="panelLayers">
        <div class="layers-list" id="layersList">
          <div class="layers-empty">
            <i class="fas fa-layer-group"></i>
            <p>No elements yet</p>
          </div>
        </div>
      </div>
      <div class="fp-resize fp-resize-r" id="resizeLeft"></div>
    </aside>

    <!-- RIGHT PANEL -->
    <aside class="fp fp-right open" id="panelRight">
      <div class="fp-head" id="fpHeadRight">
        <div class="fp-tabs">
          <button class="fp-tab active" data-rp="style">
            <i class="fas fa-paint-brush"></i> Style
          </button>
          <button class="fp-tab" data-rp="attrs">
            <i class="fas fa-cog"></i> Attrs
          </button>
        </div>
        <button class="fp-x" id="closeRight">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="fp-body" id="panelStyle">
        <div class="prop-empty" id="propsEmpty">
          <i class="fas fa-mouse-pointer"></i>
          <p>Select an element<br />to edit properties</p>
        </div>
        <div class="prop-editor hidden" id="propsEditor"></div>
      </div>
      <div class="fp-body hidden" id="panelAttrs">
        <div class="prop-empty" id="attrsEmpty">
          <i class="fas fa-cog"></i>
          <p>Select an element<br />to edit attributes</p>
        </div>
        <div class="prop-editor hidden" id="attrsEditor"></div>
      </div>
      <div class="fp-resize fp-resize-l" id="resizeRight"></div>
    </aside>

    <script src="js/state.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/widgets.js"></script>
    <script src="js/canvas.js"></script>
    <script src="js/toolbar.js"></script>
    <script src="js/panel.js"></script>
    <script src="js/keyboard.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
